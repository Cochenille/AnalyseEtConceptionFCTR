# Lab 08 — Estimer et chiffrer la proposition (séance 8, 18 novembre 2026)
# python outils/fiches/generer_fiche.py outils/fiches/labs/lab08.yaml

numero: 8
fichier: lab08-fiche-estimation.docx
titre: "Estimer et chiffrer la proposition"
contexte: "Mandat Aventure Saint-Maurice · Prépare les sections 5 et 6 de l'évaluation 2 · Travail formatif en équipe"
objectif: "estimer le travail de Studio Web FC en trois chiffres, le placer dans un échéancier qui finit avant le 1er mars, en tirer un devis sur trois ans, et choisir vos cinq questions pour Mélanie."
regle: "chaque fonctionnalité promise a ses heures dans l'estimation et son coût dans le devis."

parties:
  - titre: "Les tâches et l'estimation"
    duree: "25 min"
    a_faire: "les tâches principales sont déjà nommées. Donnez trois chiffres à chacune, puis calculez l'estimation retenue et le total. Ajoutez une tâche (T9, T10) seulement si une fonctionnalité que vous proposez n'a pas sa place."
    besoin: "vos choix provisoires (tableaux de comparaison communs) et l'activité 1 de ce soir. Estimation retenue = (optimiste + 4 × probable + pessimiste) ÷ 6."
    blocs:
      - type: liste
        prefixe: T
        rangees:
          - "Gestion de projet : courriels, appels, rencontres"
          - "Plateforme et gabarit du site"
          - "Réservation et paiement (Q1)"
          - "Décharge en ligne (Q2)"
          - "Textes en français et en anglais (Q5)"
          - "Photos et vidéos (Q4)"
          - "Tests (téléphone, clavier, deux langues) et corrections"
          - "Formation de Mélanie et de Karine, puis mise en ligne"
          - ""
          - ""
        colonnes:
          - { titre: "Quelle tâche ?", largeur: 3.6 }
          - { titre: "Optimiste", aide: "heures", largeur: 1 }
          - { titre: "Probable", aide: "heures", largeur: 1 }
          - { titre: "Pessimiste", aide: "heures", largeur: 1 }
          - { titre: "Retenue", aide: "(opt. + 4 × prob. + pess.) ÷ 6", largeur: 1.4 }
        exemple:
          - "Réservation : configurer les 4 produits et leurs heures de départ"
          - "4"
          - "6"
          - "12"
          - "6,7"
      - type: texte
        consigne: "Le total retenu, en heures et en dollars (× 75 $). La boulangerie de l'activité 1, un site bien plus simple, a pris 82 heures : votre total est-il plus grand ?"
        lignes: 2
    cochez:
      - "Chaque tâche a ses trois chiffres et son estimation retenue"
      - "Le total est calculé et converti en dollars"

  - titre: "L'échéancier"
    duree: "15 min"
    a_faire: "placez les étapes ci-dessous, à rebours du 1er mars 2027, et écrivez ce que le client doit fournir à chacune."
    besoin: "votre total d'heures de la partie 1, et l'exemple de la boulangerie (séance 8, étape 3)."
    blocs:
      - type: texte
        consigne: "Votre hypothèse : combien d'heures par semaine l'équipe consacre-t-elle au projet ? Combien de semaines cela donne-t-il ?"
        lignes: 1
      - type: liste
        rangees:
          - "Construction"
          - "Contenu, tests et corrections"
          - "Coussin (15 à 20 % de la durée)"
          - "Formation et mise en ligne"
        colonnes:
          - { titre: "Quelle étape ?", largeur: 2 }
          - { titre: "Début", aide: "date", largeur: 1 }
          - { titre: "Fin", aide: "date", largeur: 1 }
          - { titre: "Qu'est-ce qui est livré ?", aide: "ce que Mélanie peut voir ou essayer", largeur: 2.6 }
          - { titre: "Que doit fournir le client, et avant quand ?", aide: "accès, textes, photos, décisions, traduction…", largeur: 3.2 }
        exemple:
          - "Démarrage"
          - "23 nov."
          - "4 déc."
          - "Plan du site et liste des produits, approuvés"
          - "L'accès au nom de domaine et au compte Wix, avant le 4 déc."
    cochez:
      - "Les fêtes et la réponse de la MRC (janvier) sont dans le calendrier"
      - "La mise en ligne a lieu avant le 1er mars, pas le 28 février au soir"

  - titre: "Le devis d'une page"
    duree: "20 min"
    a_faire: "remplissez le devis sur trois ans, puis comparez-le au budget et à ce que l'entreprise paie aujourd'hui."
    besoin: "votre total de la partie 1, les coûts sur trois ans des tableaux de comparaison communs, et le volume du mandat : environ 2 600 réservations et 9 000 participants par été. Montants avant taxes, en dollars canadiens."
    blocs:
      - type: liste
        rangees:
          - "Construction (total de la partie 1 × 75 $)"
          - "Autre coût unique :"
          - "Abonnement :"
          - "Abonnement :"
          - "Commission :"
          - "Nom de domaine et courriel"
          - "Total"
        colonnes:
          - { titre: "Quel élément ?", largeur: 2.6 }
          - { titre: "Quel calcul ?", aide: "le volume, le prix, le taux de change", largeur: 3 }
          - { titre: "Année 1", aide: "$ CA", largeur: 1.1 }
          - { titre: "Année 2", aide: "$ CA", largeur: 1.1 }
          - { titre: "Année 3", aide: "$ CA", largeur: 1.1 }
        exemple:
          - "Commission de l'outil de réservation"
          - "2 600 réservations × 80 $ en moyenne × 2 %"
          - "4 160 $"
          - "4 160 $"
          - "4 160 $"
      - type: grille
        titre_critere: "Comparé à…"
        colonnes: ["Nos coûts", "L'écart"]
        lignes:
          - { titre: "Le budget de base : 8 000 $", aide: "coûts uniques" }
          - { titre: "Le budget avec la subvention : 13 000 $", aide: "coûts uniques" }
          - { titre: "Ce que paie l'entreprise aujourd'hui : environ 300 $ par année", aide: "coûts annuels" }
    cochez:
      - "Chaque calcul est écrit : on peut le refaire sans vous demander d'où vient le chiffre"

  - titre: "Vos cinq questions pour Mélanie"
    duree: "10 min"
    a_faire: "n'écrivez pas de nouvelles questions : choisissez-en cinq dans la section 7.2 de votre rapport 1, celles dont la réponse peut changer votre estimation, votre échéancier ou votre devis. Reformulez au besoin : une question, une décision, dans ses mots à elle."
    besoin: "votre rapport 1 (section 7.2) et ce que vous venez de chiffrer."
    blocs:
      - type: liste
        prefixe: Q
        rangees: 5
        hauteur: 0.6
        colonnes:
          - { titre: "La question", largeur: 4.4 }
          - { titre: "Ce que la réponse peut changer", aide: "une tâche, une étape, un coût, un choix", largeur: 3 }
        exemple:
          - "Quelle politique d'annulation voulez-vous offrir ?"
          - "Le choix de l'outil de réservation (Q1) et une tâche de configuration"
    cochez:
      - "La fiche, avec vos cinq questions, est déposée dans l'équipe Teams du cours avant la séance 9"

aide:
  - titre: "Trouver les trois chiffres"
    texte: "Probable : le temps si tout se passe comme d'habitude. Optimiste : rien ne bloque. Pessimiste : le pire réaliste (l'outil résiste, la cliente tarde à répondre). Pour T1, la gestion de projet prend environ 10 à 15 % du total des autres tâches."
  - titre: "Des heures aux semaines"
    texte: "Cent heures, ce n'est pas deux semaines et demie. À 15 heures par semaine, 100 heures donnent environ 7 semaines. Écrivez votre hypothèse : le correcteur doit pouvoir refaire le calcul."
  - titre: "Les commissions"
    texte: "Une commission se calcule avec le volume : nombre de réservations × montant moyen × pourcentage. Écrivez le montant moyen que vous supposez, et d'où il vient. Une commission prise sur chaque participant se calcule avec 9 000, pas 2 600."
